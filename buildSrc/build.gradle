buildscript {
    // For playground projects, use the workspace root as supportRootFolder
    if (project.hasProperty('supportRootFolder')) {
        project.ext.supportRootFolder = new File(project.property('supportRootFolder'))
    } else if (System.getProperty('supportRootFolder') != null) {
        project.ext.supportRootFolder = new File(System.getProperty('supportRootFolder'))
    } else if (System.getenv('SUPPORT_ROOT_FOLDER') != null) {
        project.ext.supportRootFolder = new File(System.getenv('SUPPORT_ROOT_FOLDER'))
    } else {
        project.ext.supportRootFolder = project.projectDir.getParentFile()
    }
    apply from: "repos.gradle"
    repos.addMavenRepositories(repositories)

    dependencies {
        classpath(libs.kotlinGradlePlugin)
    }

    configurations.classpath.resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion libs.versions.kotlin.get()
            }
        }
    }
}

// For playground projects, use the workspace root as supportRootFolder
if (project.hasProperty('supportRootFolder')) {
    ext.supportRootFolder = new File(project.property('supportRootFolder').toString())
} else if (System.getProperty('supportRootFolder') != null) {
    ext.supportRootFolder = new File(System.getProperty('supportRootFolder'))
} else if (System.getenv('SUPPORT_ROOT_FOLDER') != null) {
    ext.supportRootFolder = new File(System.getenv('SUPPORT_ROOT_FOLDER'))
} else {
    ext.supportRootFolder = project.projectDir.getParentFile()
}
apply from: "repos.gradle"
apply plugin: "kotlin"

repos.addMavenRepositories(repositories)

project.tasks.withType(Jar).configureEach { task ->
    task.reproducibleFileOrder = true
    task.preserveFileTimestamps = false
}

dependencies {
    api(project("plugins"))
}
