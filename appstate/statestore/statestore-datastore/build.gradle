import androidx.build.SoftwareType
import androidx.build.KotlinTarget
import androidx.build.PlatformIdentifier
import com.android.build.api.dsl.KotlinMultiplatformAndroidHostTestCompilation

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    alias(libs.plugins.kotlinSerialization)
}

androidXMultiplatform {
    androidLibrary {
        compileSdk { version = release(37) }
        namespace = "androidx.appstate.datastore"
        compilations.withType(KotlinMultiplatformAndroidHostTestCompilation) {
            it.returnDefaultValues = true
        }
    }

    desktop()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":appstate:statestore:statestore"))
            api(project(":appstate:transform:transform"))
            api("androidx.datastore:datastore-core:1.3.0")
            api("androidx.datastore:datastore-core-okio:1.3.0")
            api(libs.kotlinSerializationJson)
            api(libs.kotlinCoroutinesCore)
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(libs.kotlinCoroutinesTest)
            implementation(project(":kruth:kruth"))
            implementation(libs.okio)
        }

        // The file-backed overload of syncToDataStore needs okio's FileSystem.SYSTEM, which web
        // targets do not have.
        nonWebMain {
            dependsOn(commonMain)
        }
        androidMain.dependsOn(nonWebMain)
        desktopMain.dependsOn(nonWebMain)
        nativeMain.dependsOn(nonWebMain)

        nonWebTest {
            dependsOn(commonTest)
        }
        androidHostTest.dependsOn(nonWebTest)
        androidDeviceTest.dependsOn(nonWebTest)
        desktopTest.dependsOn(nonWebTest)
        nativeTest.dependsOn(nonWebTest)

        desktopTest.dependencies {
            implementation(libs.kotlinTestJunit)
        }

        androidDeviceTest.dependencies {
            implementation(libs.junit)
            implementation(libs.testExtJunit)
            implementation(libs.testCore)
            implementation(libs.testRunner)
            implementation(libs.testRules)
        }
    }
}

androidx {
    name = "AndroidX AppState StateStore DataStore"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2026"
    description = "Provides a persistence bridge between StateStore and DataStore."
    samples(project(":appstate:statestore:statestore-datastore:statestore-datastore-samples"))
    kotlinTarget = KotlinTarget.KOTLIN_2_3
    deviceTests {
        maxShardCount = 1
    }
}
