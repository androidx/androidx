import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
}

dependencies {
    api(project(":camera:camera-core"))
    api(libs.androidx.core)
    api("androidx.lifecycle:lifecycle-livedata-core:2.3.1")
    implementation(libs.playServicesCameraLowLightBoost)

    testImplementation(project(":camera:camera-testing"))
    testImplementation(libs.testCore)
    testImplementation(libs.testRunner)
    testImplementation(libs.testRules)
    testImplementation(libs.robolectric)
    testImplementation(libs.truth)
    testImplementation(libs.junit)

    androidTestImplementation(project(":camera:camera-testing")) {
        // Ensure camera-testing does not pull in androidx.test dependencies
        exclude(group: "androidx.test")
    }
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.truth)
    androidTestImplementation(libs.junit)
}

android {
    compileSdk { version = release(37) }
    namespace = "androidx.camera.effects.playservices"
}

androidx {
    name = "Camera Effects Play Services"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2026"
    description = "Camera effects integration for CameraX powered by Google Play Services."
    enableRobolectric()
}
