import androidx.build.AndroidXConfig
import androidx.build.SoftwareType
import com.android.build.api.variant.HasAndroidTest

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    // Needed for @Composable test content in androidTest (MacrobenchUiAutomatorExtensionsTest).
    id("AndroidXComposePlugin")
}

dependencies {
    implementation(project(":benchmark:benchmark-macro"))
    implementation(project(":benchmark:benchmark-macro-junit4"))
    implementation(project(":test:uiautomator:uiautomator"))
    implementation(project(":test:uiautomator:uiautomator-shell"))
    implementation(libs.testExtJunit)

    // AndroidXComposePlugin applies the Compose compiler plugin to all Kotlin compilation tasks in
    // this module (including main), which requires Compose Runtime on the compile classpath.
    compileOnly(project(":compose:runtime:runtime"))

    androidTestImplementation(project(":compose:foundation:foundation"))
    androidTestImplementation(project(":compose:runtime:runtime"))
    androidTestImplementation(project(":compose:ui:ui"))
    androidTestImplementation(project(":compose:ui:ui-test-junit4"))
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.truth)
    androidTestRuntimeOnly(project(":compose:test-utils"))
}

android {
    namespace = "androidx.testutils.macrobenchmark"
}

androidComponents {
    def testDataPath = new File(
            AndroidXConfig.getPrebuiltsRoot(project),
            "androidx/traceprocessor/testdata").absolutePath
    onVariants(selector().all()) { variant ->
        def androidTestAssets = (variant as HasAndroidTest).androidTest.sources.assets
        androidTestAssets.addStaticSourceDirectory(testDataPath)
    }
}

androidx {
    type = SoftwareType.INTERNAL_TEST_LIBRARY
}
