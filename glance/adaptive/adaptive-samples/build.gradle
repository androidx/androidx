import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.application")
    id("AndroidXComposePlugin")
}

android {
    namespace = "androidx.glance.adaptive.samples"
    // Required by project(":compose:ui:ui") and project(":compose:foundation:foundation") AAR metadata
    compileSdk { version = release(37) { minorApiLevel = 1 } }

    defaultConfig {
        minSdk { version = release(29) }
    }
}

dependencies {
    implementation(project(":glance:adaptive:adaptive-core"))
    implementation(project(":glance:adaptive:adaptive-appwidget"))
    implementation(project(":activity:activity"))
    implementation(project(":activity:activity-compose"))
    implementation(project(":compose:ui:ui"))
    implementation(project(":compose:foundation:foundation"))
    implementation(project(":compose:foundation:foundation-layout"))
    implementation(project(":compose:material3:material3"))
    implementation(project(":lifecycle:lifecycle-runtime"))
}

androidx {
    name = "Glance Adaptive Samples"
    type = SoftwareType.SAMPLES
    inceptionYear = "2026"
    description = "Contains the sample code and demo application for Glance Adaptive Widgets"
}
