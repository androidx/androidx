android {
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    namespace = "androidx.wear.compose.remote.integration.demos"
    defaultConfig {
        minSdk { version = release(29) }
    }
    useLibrary("wear-sdk")
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    sourceSets {
        test {
            kotlin.srcDirs += [file("src/sharedTest/java")]
        }
        androidTest {
            kotlin.srcDirs += [file("src/sharedTest/java")]
        }
    }
}

androidx {
    name = "Wear Remote Compose demos"
