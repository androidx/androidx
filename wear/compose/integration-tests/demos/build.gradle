plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.application")
}

android {
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId = "androidx.wear.compose.integration.demos"
        minSdk { version = release(25) }
        versionCode = 124
        versionName = "1.124"
    }

    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
    namespace = "androidx.wear.compose.integration.demos"
}

dependencies {

    implementation(project(":compose:foundation:foundation"))
    implementation(project(":compose:foundation:foundation-layout"))
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation(project(":compose:ui:ui:ui-samples"))
    implementation("androidx.compose.material:material-icons-core:1.6.7")

    implementation(project(":wear:compose:compose-foundation"))
    implementation(project(":wear:compose:compose-foundation-samples"))
    implementation(project(":wear:compose:compose-material"))
    implementation(project(":wear:compose:compose-material-samples"))
    implementation(project(":wear:compose:compose-material3"))
    implementation(project(":wear:compose:compose-navigation"))
    implementation(project(":wear:compose:compose-navigation-samples"))
    implementation(project(":wear:compose:compose-navigation3"))
    implementation(project(":wear:compose:compose-navigation3-samples"))
    implementation(project(":navigation3:navigation3-ui"))
    implementation(project(":wear:compose:compose-material3-samples"))
    implementation(project(":wear:compose:integration-tests:demos:common"))
    implementation(project(":wear:compose:compose-material3-integration-tests"))

    // Needed for consistent resolution of androidx.concurrent:concurrent-futures in debugAndroidTestRuntimeClasspath
    androidTestImplementation(project(":compose:runtime:runtime"))
    androidTestImplementation(project(":compose:ui:ui-test-junit4"))
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.espressoCore)
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.truth)
}

androidx {
    deviceTests {
        maxShardCount = 1
    }
}
