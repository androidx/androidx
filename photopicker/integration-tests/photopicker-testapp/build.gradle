import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.application")
    id("AndroidXComposePlugin")
}

dependencies {
    implementation(project(":photopicker:photopicker"))
    implementation(project(":photopicker:photopicker-compose"))

    // Compose dependencies
    def compose_version = "1.11.4"
    implementation("androidx.compose.runtime:runtime:$compose_version")
    implementation("androidx.compose.ui:ui:$compose_version")
    implementation("androidx.compose.material3:material3:1.3.1")
    implementation(libs.androidx.activity.compose)
    implementation("androidx.compose.material:material-icons-core:1.7.8")
    implementation("androidx.compose.material:material-icons-extended:1.7.8")

    // Standard AndroidX dependencies
    implementation("androidx.annotation:annotation:1.9.1")
    implementation("com.google.android.material:material:1.11.0")
}

android {
    namespace = "androidx.photopicker.integration.testapp"
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId = "androidx.photopicker.integration.testapp"
        minSdk { version = release(34) }
        targetSdk { version = release(37) }
    }
    buildTypes {
        release {
            minifyEnabled = false
        }
    }
}

androidx {
    name = "Photopicker Test App"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description = "Test application for Embedded PhotoPicker"
}
