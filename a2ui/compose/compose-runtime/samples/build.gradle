import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
}

dependencies {
    compileOnly(project(":annotation:annotation-sampled"))

    implementation(project(":a2ui:a2ui-model"))
    implementation(project(":a2ui:compose:compose-runtime"))
    implementation(project(":a2ui:compose:compose-ui"))

    implementation("androidx.compose.foundation:foundation:1.13.0")
    implementation("androidx.compose.foundation:foundation-layout:1.13.0")
    implementation("androidx.compose.runtime:runtime:1.13.0")
    implementation("androidx.compose.ui:ui:1.13.0")
    implementation("androidx.compose.ui:ui-graphics:1.13.0")
    implementation("androidx.compose.ui:ui-text:1.13.0")
    implementation("androidx.compose.ui:ui-unit:1.13.0")
}

android {
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    namespace = "androidx.a2ui.compose.runtime.samples"
}

androidx {
    name = "A2UI Compose Runtime Samples"
    type = SoftwareType.SAMPLES
    inceptionYear = "2026"
    description = "Samples for the Jetpack Compose A2UI renderer runtime APIs."
}
