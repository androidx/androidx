import androidx.build.AndroidXComposePlugin
import androidx.build.Publish
import org.jetbrains.androidx.build.JetBrainsAndroidXPlugin

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

AndroidXComposePlugin.applyAndConfigureKotlinPlugin(project)
JetBrainsAndroidXPlugin.applyAndConfigure(project)

androidXComposeMultiplatform {
    android()
    desktop()
    darwin()
    js()
    wasm()
    linux()
}

kotlin {
    watchosArm64()
    watchosArm32()
    watchosX64()
    watchosSimulatorArm64()
    tvosArm64()
    tvosX64()
    tvosSimulatorArm64()
    mingwX64()

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty('artifactRedirection.version.androidx.savedstate')
                api("androidx.savedstate:savedstate-compose:$version")

                // Keep direct references to fork versions to correctly resolve
                // New redirections to Google's artifacts
                api(project(":savedstate:savedstate"))
                api("org.jetbrains.compose.runtime:runtime:1.9.1")
            }
        }
    }
}

android {
    namespace = "androidx.savedstate.compose"
}

androidx {
    name = "Saved State Compose"
    publish = Publish.SNAPSHOT_AND_RELEASE
    inceptionYear = "2024"
    description = "Compose integration with Saved State"
    metalavaK2UastEnabled = false
}
