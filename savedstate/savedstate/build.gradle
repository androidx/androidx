import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.savedstate") {
        androidLibrary {
            namespace = "org.jetbrains.savedstate"
            optimization {
                it.consumerKeepRules.publish = true
                it.consumerKeepRules.files.add(new File("proguard-rules.pro"))
            }
            androidResources.enable = true
        }
        desktop()
        mac()
        linux()
        ios()
        watchos()
        tvos()
        mingwX64()
        js()
        wasmJs()
    }

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                // Keep direct references to fork versions to correctly resolve
                // new redirections to Google's artifacts.
                implementation("org.jetbrains.androidx.lifecycle:lifecycle-common:2.9.6")
            }
        }
    }
}

androidx {
    name = "Saved State"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2018"
    description = "Android Lifecycle Saved State"
}
