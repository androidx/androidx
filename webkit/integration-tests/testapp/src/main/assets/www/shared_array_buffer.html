<html>
<body>
<p>This demo sends 2 variables to a worker for processing (in this case
    multiplying by 2 both numbers) via a SharedArrayBuffer.</p>
<label for="v0">v[0]</label><input id="v0"><br>
<label for="v1">v[1]</label><input id="v1"><br>
<button id="send">Send to Worker</button>
<script>
    const sab = new SharedArrayBuffer(16);
    const view = new Int32Array(sab);
    const myWorker = new Worker('shared_array_buffer_worker.js');
    myWorker.addEventListener('message', event => {
        document.getElementById("v0").value = view[0];
        document.getElementById("v1").value = view[1];
    });
    document.getElementById("send").addEventListener("click", event => {
        view[0] = Number(document.getElementById("v0").value);
        view[1] = Number(document.getElementById("v1").value);
        myWorker.postMessage(sab);
    });
</script>
</body>
</html>
