import androidx.build.JetbrainsAndroidXPlugin
import androidx.build.AndroidXComposePlugin
import androidx.build.Publish
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
    id("JetbrainsAndroidXPlugin")
}

AndroidXComposePlugin.applyAndConfigureKotlinPlugin(project)
JetbrainsAndroidXPlugin.applyAndConfigure(project)

androidXComposeMultiplatform {
    android()
    desktop()
    darwin()
    js()
    wasm()
}

kotlin {
    sourceSets {
        commonMain {
            dependencies {
                api(project(":lifecycle:lifecycle-common"))
                api(project(":lifecycle:lifecycle-viewmodel"))
                api("androidx.annotation:annotation:1.9.1")
                api(project(":compose:runtime:runtime"))

                // Moved from platform dependencies
                api(project(":lifecycle:lifecycle-viewmodel-savedstate"))
                api(project(":compose:ui:ui"))

                api(libs.kotlinSerializationCore)
                implementation(libs.kotlinStdlib)
            }
        }

        jvmMain.dependsOn(commonMain)
        androidMain.dependsOn(commonMain)

        androidInstrumentedTest {
            dependsOn(commonTest)
            dependencies {
                implementation(project(":compose:ui:ui-test-junit4"))
                implementation(project(":compose:test-utils"))
                implementation(libs.testRules)
                implementation(libs.testRunner)
                implementation(libs.junit)
                implementation(libs.truth)
                implementation("androidx.fragment:fragment:1.3.0")
                implementation("androidx.appcompat:appcompat:1.3.0")
                implementation("androidx.activity:activity-compose:1.10.1")
            }
        }

        nonAndroidMain {
            dependsOn(commonMain)
        }

        desktopMain {
            dependsOn(jvmMain)
            dependsOn(nonAndroidMain)
        }
        nonJvmMain.dependsOn(nonAndroidMain)
        nativeMain.dependsOn(nonJvmMain)
        webMain.dependsOn(nonJvmMain)

        targets.configureEach { target ->
            if (target.platformType == KotlinPlatformType.native) {
                target.compilations["main"].defaultSourceSet.dependsOn(nativeMain)
            } else if (target.platformType in [KotlinPlatformType.js, KotlinPlatformType.wasm]) {
                target.compilations["main"].defaultSourceSet.dependsOn(webMain)
            }
        }
    }
}

androidx {
    name = "Lifecycle ViewModel Compose"
    publish = Publish.SNAPSHOT_AND_RELEASE
    inceptionYear = "2021"
    description = "Compose integration with Lifecycle ViewModel"
}

android {
    namespace = "androidx.lifecycle.viewmodel.compose"
}
