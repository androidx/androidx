    implementation(libs.androidx.annotation)
    implementation("androidx.core:core:1.6.0")

    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.compose.foundation:foundation:1.13.0")
    implementation("androidx.compose.foundation:foundation-layout:1.13.0")
    implementation("androidx.compose.material:material:1.13.0")
    implementation("androidx.compose.runtime:runtime:1.13.0")
    implementation("androidx.compose.ui:ui:1.13.0")
    implementation("androidx.compose.ui:ui-graphics:1.13.0")
    implementation("androidx.compose.ui:ui-text:1.13.0")
    implementation("androidx.compose.ui:ui-unit:1.13.0")

    androidTestImplementation(project(":test:uiautomator:uiautomator"))
    androidTestImplementation(project(":test:uiautomator:uiautomator-shell"))
    androidTestImplementation(libs.testCore)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.dexmakerMockito)
