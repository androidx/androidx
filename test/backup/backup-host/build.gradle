    api(libs.kotlinCoroutinesGuava)
    api(libs.androidx.annotation)
    api(libs.kotlinTest)
    implementation(libs.kotlinSerializationJson)

    // JUnit 5 API dependencies for host extensions
    api("org.junit.jupiter:junit-jupiter-api:5.7.0")

    // Android Studio dependencies
    implementation("com.android.tools.backup:backup-restore:32.5.0-alpha03")
    implementation("com.android.tools.adblib:adblib:9.5.0-alpha03")
    implementation("com.android.tools.adblib:adblib-tools:9.5.0-alpha03")
