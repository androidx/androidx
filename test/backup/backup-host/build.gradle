}

androidx {
    kotlinTarget = androidx.build.KotlinTarget.KOTLIN_2_2
    name = "Backup Host"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2026"
    description = "Host-side orchestrated control and JUnit 5 extensions for Automated Backup and Restore testing."
