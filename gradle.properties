org.gradle.jvmargs=-Xmx12g \
  -XX:+HeapDumpOnOutOfMemoryError \
  -XX:+UseParallelGC \
  -Dkotlin.daemon.jvm.options=-XX:MaxMetaspaceSize=1g,-Xmx8g \
  -Dlint.nullness.ignore-deprecated=true \
  -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.welcome=never
# Disabled due to https://github.com/gradle/gradle/issues/18626
# org.gradle.vfs.watch=true
# Reenabled in gradlew, but disabled in Studio until these errors become shown (b/268380971) or computed more quickly (https://github.com/gradle/gradle/issues/23272)
org.gradle.dependency.verification=off
org.gradle.dependency.verification.console=verbose
org.gradle.configuration-cache=true
# Do not fail on
# Plugin 'org.jetbrains.gradle.apple.applePlugin': external process started 'xcode-select -print-path'
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.entries-per-key=2
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=ANDROIDX_JDK21

# Settings that will change in AGP 9.0.0 ----------------------------
android.enableAppCompileTimeRClass=true
# TODO(aurimas): flip the rest of these flags, they fail right now
android.newDsl=false
android.compatibility.enableLegacyApi=true
android.builtInKotlin=false
android.disallowKotlinSourceSets=false
# -------------------------------------------------------------------

android.disableAgpUpgradePrompt=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.lint.baselineOmitLineNumbers=true
android.lint.printStackTrace=true
android.builder.sdkDownload=true
android.uniquePackageNames=true
android.enableAdditionalTestOutput=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.lint.missingBaselineIsEmptyBaseline=true
android.experimental.lint.reservedMemoryPerTask=1g
# Remove when AGP defaults to 2.1.0
android.prefabVersion=2.1.0

# Don't generate versioned API files
androidx.writeVersionedApiFiles=false

# Don't run the CheckAarMetadata task
android.experimental.disableCompileSdkChecks=false

# Don't warn about needing to update AGP
android.suppressUnsupportedCompileSdk=35,Baklava

androidx.compileSdk=34
androidx.latestStableCompileSdk=36
androidx.targetSdkVersion=36

# Disable features we do not use
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Enable adding baseline-prof.txt files to AAR artifacts
android.experimental.enableArtProfiles=true
# Disables dependency constraints for libraries (b/276714425)
android.experimental.dependency.excludeLibraryComponentsFromConstraints=true
# Disallow resolving dependencies at configuration time, which is a slight performance problem
android.dependencyResolutionAtConfigurationTime.disallow=true
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.dependencyResolutionAtConfigurationTime.disallow,android.experimental.lint.missingBaselineIsEmptyBaseline,android.lint.printStackTrace,android.lint.baselineOmitLineNumbers,android.experimental.disableCompileSdkChecks,android.overrideVersionCheck,android.r8.maxWorkers,android.experimental.lint.reservedMemoryPerTask,android.experimental.dependency.excludeLibraryComponentsFromConstraints,android.prefabVersion,android.experimental.skipApksViaBundleIfPossible,android.enableCompileRuntimeClasspathAlignment,android.proguard.failOnMissingFiles,android.enableAppCompileTimeRClass,android.r8.optimizedResourceShrinking,android.disallowKotlinSourceSets
# Workaround for b/162074215
android.includeDependencyInfoInApks=false
# Allow multiple r8 tasks at once because otherwise they can make the critical path longer: b/256187923
android.r8.maxWorkers=2

# mac targets cannot be built on linux, suppress the warning.
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
kotlin.mpp.enableCInteropCommonization=true
# Suppress pointless warning about mpp being experimental
kotlin.mpp.stability.nowarn=true
# b/227307216
kotlin.mpp.absentAndroidTarget.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Until we get a newer AGP which doesn't do this
kotlin.options.suppressFreeCompilerArgsModificationWarning=true

# Properties we often want to toggle
ksp.version.check=false

# Use fast-path APKs from AGP, ensuring that single APK will be used (for FTL configs)
android.experimental.skipApksViaBundleIfPossible=true

# Annotation processors discovery from compile classpath is deprecated
kapt.include.compile.classpath=false

# Disable dependency analysis compatibility check
dependency.analysis.compatibility=NONE

# Preserve the test APKs after a test run
android.injected.androidTest.leaveApksInstalledAfterRun=true

# Remove when https://youtrack.jetbrains.com/issue/KT-70013 is fixed
org.gradle.configuration-cache.inputs.unsafe.ignore.file-system-checks=**/out/.gradle/nodejs;**/out/.gradle/yarn;**/out/.gradle/binaryen

# Use kapt with K2 compiler: https://kotlinlang.org/docs/kapt.html#annotation-processor-arguments
kapt.use.k2=true


# JetBrains fork only properties

# jetbrains-fork in jb-main branch
androidx.studio.type=jetbrains-fork

# In which browsers run web tests
jetbrains.androidx.web.tests.enableChrome=true
jetbrains.androidx.web.tests.enableChromium=false
jetbrains.androidx.web.tests.enableFirefox=false
jetbrains.androidx.web.tests.enableSafari=false

kotlinx.atomicfu.enableJsIrTransformation=true
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlinx.atomicfu.enableNativeIrTransformation=true

# Compose Multiplatform doesn't have its own implementation for some target.
# When user adds a dependency on `org.jetbrains.*` in these targets,
# in fact `androidx.*` is used.
#
# Versions should equal the last merged to the branch
# Format:
#   artifactRedirection.version.<redirectionGroup>.<redirectionModule>
#   covers all sub-module projects
#   (artifactRedirection.version.androidx.compose covers androidx.compose.*:*)
artifactRedirection.version.androidx.compose=1.12.0-alpha02
artifactRedirection.version.androidx.compose.material3=1.5.0-alpha19
artifactRedirection.version.androidx.compose.material3.adaptive=1.3.0-beta01
artifactRedirection.version.androidx.compose.material3.common=1.0.0-alpha01
artifactRedirection.version.androidx.collection=1.5.0
artifactRedirection.version.androidx.annotation=1.9.1
artifactRedirection.version.androidx.graphics=1.1.0-alpha01
artifactRedirection.version.androidx.lifecycle=2.11.0-beta01
artifactRedirection.version.androidx.navigation=2.10.0-alpha05
artifactRedirection.version.androidx.navigation3=1.1.0-rc01
artifactRedirection.version.androidx.navigationevent=1.1.1
artifactRedirection.version.androidx.performance=1.0.0-alpha01
artifactRedirection.version.androidx.savedstate=1.5.0-alpha01
artifactRedirection.version.androidx.window=1.5.0

# A special workaround introduced in Kotlin 2.3.20 to support the Compose redirects.
# See https://youtrack.jetbrains.com/issue/KT-83917
kotlin.internal.kmp.allowMatchingByRequestedCoordinatesInMetadataTransformations=true