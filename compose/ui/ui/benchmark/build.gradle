import androidx.build.SoftwareType
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.gradle.api.attributes.java.TargetJvmEnvironment

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("AndroidXComposePlugin")
    id("androidx.benchmark")
}

configurations {
    // Configuration to access internal implementation of foundation library
    // This removes need for suppressing INVISIBLE_REFERENCE and INVISIBLE_MEMBER in codebase
    // IDE does not support this configuration yet, so you will still see references to internal
    // members marked as an error. You can ignore them.
    friends {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, objects.named(TargetJvmEnvironment, TargetJvmEnvironment.ANDROID))
            attribute(Attribute.of("artifactType", String), "android-classes-jar")
        }
    }
    androidTestImplementation.extendsFrom(friends)
}

dependencies {
    friends(project(":compose:ui:ui"))
    androidTestImplementation("androidx.lifecycle:lifecycle-runtime-testing:2.5.1")
    androidTestImplementation("androidx.activity:activity-compose:1.3.1")
    androidTestImplementation(project(":benchmark:benchmark-junit4"))
    androidTestImplementation(project(":compose:foundation:foundation"))
    androidTestImplementation(project(":compose:foundation:foundation-layout"))
    androidTestImplementation(project(":compose:material:material"))
    androidTestImplementation(project(":compose:runtime:runtime"))
    androidTestImplementation(project(":compose:benchmark-utils"))
    androidTestImplementation(project(":compose:ui:ui"))
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.kotlinTest)
    androidTestImplementation(libs.truth)
}

android {
    compileSdk { version = release(37) }
    namespace = "androidx.compose.ui.benchmark"
}

androidx {
    type = SoftwareType.BENCHMARK
}

tasks.withType(KotlinCompile).configureEach {
    it.friendPaths.from(configurations.friends.incoming.files)
}
