import androidx.build.SoftwareType
import com.android.build.api.variant.HasAndroidTest
import javax.inject.Inject
import org.gradle.work.DisableCachingByDefault

import static androidx.inspection.gradle.InspectionPluginKt.createConsumeInspectionConfiguration

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.library")
}

@DisableCachingByDefault(because = "Copy type task")
abstract class CopyInspectorJarToAssetsTask extends DefaultTask {
    @Inject abstract FileSystemOperations getFileSystemOperations()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getDistJarFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputFolder()

    @TaskAction
    void copy() {
        getFileSystemOperations().copy {
            it.from(getDistJarFiles())
            it.into(getOutputFolder())
        }
    }
}

def consumeInspector = createConsumeInspectionConfiguration(project)

def copyInspectorJarToAssets = tasks.register("copyInspectorJarToAssets", CopyInspectorJarToAssetsTask) {
    it.distJarFiles.from(consumeInspector.incoming.files)
    it.outputFolder.set(layout.buildDirectory.dir("generated/assets/inspector"))
}

androidx {
    name = "Compose Layout Inspector Jar Integration Tests"
    type = SoftwareType.INTERNAL_TEST_LIBRARY
    inceptionYear = "2026"
    description = "Tests Compose Layout Inspector using compose-ui-inspection.jar"
}

android {
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig {
        minSdk { version = release(29) }
    }
    namespace = "androidx.compose.ui.inspection.jartest"
    testNamespace = "androidx.compose.ui.inspection.test"

    sourceSets {
        androidTest {
            java.srcDirs += ["../../src/androidTest/java"]
            kotlin.srcDirs += ["../../src/androidTest/java"]
            res.srcDirs += ["../../src/androidTest/res"]
            manifest.srcFile "../../src/androidTest/AndroidManifest.xml"

            // Only run black-box E2E integration tests against the inspector JAR.
            // Exclude white-box unit tests in internal/ that directly test internal classes.
            java.exclude("**/internal/**")
            kotlin.exclude("**/internal/**")
        }
    }
}

androidComponents {
    onVariants(selector().all(), { variant ->
        if (variant instanceof HasAndroidTest) {
            ((HasAndroidTest) variant).androidTest?.sources?.assets?.addGeneratedSourceDirectory(
                copyInspectorJarToAssets,
                CopyInspectorJarToAssetsTask::getOutputFolder
            )
        }
    })
}

dependencies {
    add(consumeInspector.name, project(":compose:ui:ui-inspection"))
    androidTestImplementation(project(":compose:ui:ui-inspection"))

    androidTestImplementation(libs.protobufLite)
    androidTestImplementation(libs.kotlinCoroutinesAndroid)
    androidTestImplementation(libs.testCore)
    androidTestImplementation(project(":compose:foundation:foundation-layout"))
    androidTestImplementation(project(":compose:ui:ui-tooling"))
    androidTestImplementation(project(":compose:ui:ui-tooling-data"))
    androidTestImplementation(project(":compose:ui:ui"))
    androidTestImplementation(project(":compose:foundation:foundation"))
    androidTestImplementation(project(":compose:ui:ui-util"))
    androidTestImplementation(project(":compose:ui:ui-test-junit4"))
    androidTestImplementation(project(":internal-testutils-fonts"))
    androidTestImplementation(project(":compose:material:material"))
    androidTestImplementation("androidx.compose.material:material-icons-core:1.6.7")
    androidTestImplementation("androidx.compose.material3:material3:1.3.1")
    androidTestImplementation(project(":inspection:inspection-testing"))
    androidTestImplementation("androidx.activity:activity-compose:1.3.1")
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.espressoCore)
    androidTestImplementation(libs.truth)
}
