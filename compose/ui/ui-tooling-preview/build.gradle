import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        namespace = "androidx.compose.ui.tooling.preview"
    }
    desktop()
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api("androidx.annotation:annotation:1.9.1")
            api(project(":compose:runtime:runtime"))
        }

        androidHostTest.dependencies {
            implementation(libs.junit)
        }

        nonAndroidMain {
            dependsOn(commonMain)
        }

        nonAndroidTest {
            dependsOn(commonTest)
        }

        desktopMain {
            dependsOn(nonAndroidMain)
        }

        desktopTest {
            dependsOn(nonAndroidTest)
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
            dependencies {
                // To comply with Klib resolver until https://youtrack.jetbrains.com/issue/KT-61096 is fixed
                implementation("org.jetbrains.compose.annotation-internal:annotation:1.10.0")
            }
        }

        nonJvmTest {
            dependsOn(nonAndroidTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
        }
    }
}

androidx {
    name = "Compose UI Preview Tooling"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2021"
    description = "Compose tooling library API. This library provides the API required to declare" +
            " @Preview composables in user apps."
    legacyDisableKotlinStrictApiMode = true
    samples(project(":compose:ui:ui-tooling-preview:ui-tooling-preview-samples"))
}

