import androidx.build.KmpPlatformsKt
import androidx.build.LibraryType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.library")
    id("JetbrainsAndroidXPlugin")
}

androidXMultiplatform {
    android()
    desktop()

    // TODO: https://youtrack.jetbrains.com/issue/CMP-8954

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                implementation(libs.kotlinStdlib)
                api("androidx.annotation:annotation:1.9.1")
                api(project(":compose:runtime:runtime"))
            }
        }

        commonTest {
            dependencies {
                implementation(libs.kotlinTest)
            }
        }

        jvmMain {
            dependsOn(commonMain)
        }

        skikoMain {
            dependsOn(commonMain)
        }

        androidMain {
            dependsOn(jvmMain)
            dependencies {
                api("androidx.annotation:annotation:1.2.0")
            }
        }

        jvmTest {
            dependsOn(commonTest)
        }

        androidAndroidTest {
            dependsOn(jvmTest)
        }

        androidTest {
            dependsOn(jvmTest)
            dependencies {
                implementation(libs.junit)
            }
        }

        desktopMain {
            dependsOn(skikoMain)
            dependsOn(jvmMain)
        }

        desktopTest {
            dependsOn(jvmTest)
            dependsOn(desktopMain)
        }
    }
}

androidx {
    name = "Compose UI Preview Tooling"
    type = LibraryType.PUBLISHED_LIBRARY
    inceptionYear = "2021"
    description = "Compose tooling library API. This library provides the API required to declare" +
            " @Preview composables in user apps."
    legacyDisableKotlinStrictApiMode = true
}

android {
    namespace "androidx.compose.ui.tooling.preview"
}
