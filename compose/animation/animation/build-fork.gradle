plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.compose.animation") {
        androidLibrary {
            namespace = "org.jetbrains.androidx.compose.animation"

            compileSdk = 35
            // Define rules for R8 to strip out AnimationVisualDebug classes and methods in release builds
            optimization {
                it.consumerKeepRules.publish = true
                it.consumerKeepRules.files.add(new File("consumer-proguard-rules.pro"))
            }
        }
    }
    desktop()
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":compose:animation:animation-core"))
            api(project(":compose:foundation:foundation-layout"))
            api(project(":compose:runtime:runtime"))
            api(project(":compose:ui:ui-geometry"))

            implementation(project(":compose:ui:ui"))
            implementation(project(":compose:ui:ui-util"))
            implementation(project(":compose:ui:ui-graphics"))
            implementation("androidx.collection:collection:1.5.0")
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
        }

        androidMain.dependencies {
            api("androidx.annotation:annotation:1.8.1")
            api("androidx.annotation:annotation-experimental:1.4.1")
        }

        androidDeviceTest.dependencies {
            implementation(libs.testRules)
            implementation(libs.testRunner)
            implementation(libs.junit)
            implementation(libs.truth)
            implementation(libs.leakcanary)
            implementation(libs.leakcanaryInstrumentation)
            implementation(project(":compose:foundation:foundation"))
            implementation(project(":compose:material3:material3"))
            implementation("androidx.compose.ui:ui-test-junit4:1.2.1")
            implementation(project(":compose:test-utils"))
        }

        androidHostTest.dependencies {
            implementation(libs.testRules)
            implementation(libs.testRunner)
            implementation(libs.junit)
        }

        nonAndroidMain {
            dependsOn(commonMain)
        }

        nonAndroidTest {
            dependsOn(commonTest)
        }

        desktopMain {
            dependsOn(nonAndroidMain)
        }

        desktopTest {
            dependsOn(nonAndroidTest)
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
