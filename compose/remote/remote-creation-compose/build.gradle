import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
}

androidXMultiplatform {
    androidLibrary {
        minSdk { version = release(29) }
        compileSdk { version = release(35) }
        namespace = "androidx.compose.remote.creation.compose"
        androidResources.enable = true
    }
    jvm()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        jvmAndAndroidMain.dependencies {
            api(project(":compose:remote:remote-creation-expression"))
            api("androidx.compose.runtime:runtime:1.11.0")
            implementation(project(":compose:remote:remote-creation"))
            implementation("androidx.collection:collection:1.7.0")
        }

        androidMain.dependencies {
            api(project(":compose:remote:remote-creation"))
            api("androidx.collection:collection:1.7.0")
            api("androidx.compose.ui:ui:1.11.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel:2.10.0")
            implementation("androidx.tracing:tracing:2.0.0")
        }

        androidHostTest.dependencies {
            implementation(libs.junit)
            implementation(libs.truth)
            implementation(project(":compose:remote:foundation:foundation"))
            implementation(project(":compose:remote:remote-testing"))
            implementation(project(":compose:remote:remote-core-testutils"))
            implementation(project(":compose:remote:remote-player-view"))
            implementation(project(":compose:remote:remote-player-compose"))
            implementation(project(":compose:remote:remote-player-compose-testutils"))
            implementation(project(":compose:remote:remote-player-core"))
            implementation("androidx.compose.ui:ui-test-junit4:1.12.0")
            implementation("androidx.core:core-ktx:1.16.0")
            implementation(libs.testCoreKtx)
            implementation(libs.testRules)
            implementation(libs.kotlinCoroutinesTest)
            implementation(libs.kotlinTest)
        }

        androidDeviceTest.dependencies {
            implementation("androidx.compose.foundation:foundation:1.11.0")
            implementation("androidx.compose.material:material:1.11.0")
            implementation(libs.testExtJunit)
            implementation(libs.junit)
            implementation(libs.truth)
            implementation(libs.kotlinTest)
            implementation(libs.testRunner)
            implementation(libs.dexmakerMockito)
            implementation(libs.mockitoCore)
            implementation(libs.mockitoKotlin)
            implementation(project(":test:uiautomator:uiautomator"))
            implementation(project(":test:uiautomator:uiautomator-shell"))
            implementation(project(":compose:remote:remote-core-testutils"))
            implementation(project(":compose:remote:remote-player-view"))
            implementation(project(":compose:remote:remote-player-compose-testutils"))
            implementation(project(":compose:remote:foundation:foundation"))
            implementation(project(":compose:remote:remote-testing"))
            implementation(project(":compose:remote:remote-player-compose"))
            implementation(project(":compose:remote:remote-player-core"))
            implementation(project(":compose:test-utils"))
            implementation("androidx.compose.ui:ui-test-junit4:1.12.0")
            implementation(project(":test:screenshot:screenshot"))
            implementation(project(":compose:remote:remote-creation-compose-samples"))
            implementation("org.jetbrains.kotlin:kotlin-reflect")
        }
    }
}

dependencies {
    lintChecks(project(":compose:remote:remote-lint"))
    lintPublish(project(":compose:remote:remote-lint"))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.deviceTests.values().forEach {
            it.pseudoLocalesEnabled.set(true)
        }
    }
}

androidx {
    name = "Remote Compose Creation Compose"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2024"
    description = "Provides a compose API to create RemoteCompose documents"
    enableRobolectric()
    addGoldenImageAssets()
    samples(project(":compose:remote:remote-creation-compose-samples"))
    // TODO: b/582487979 - Remove once BanRestrictTo exemption is applied to lintJvm.
    afterEvaluate {
        lint {
            disable.add("BanRestrictTo")
        }
    }
}

