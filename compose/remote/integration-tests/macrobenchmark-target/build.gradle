plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.application")
}

group="androidx.compose.remote"

android {
    compileSdk { version = release(37) { minorApiLevel = 1 } }

    namespace = "androidx.compose.remote.integration.macrobenchmark.target"
    defaultConfig.minSdk { version = release(29) }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

dependencies {
    implementation(project(":compose:remote:remote-core"))
    implementation(project(":compose:remote:remote-creation"))
    implementation(project(":compose:remote:remote-creation-compose"))
    implementation(project(":compose:remote:remote-creation-core"))
    implementation(project(":compose:remote:remote-player-compose"))
    implementation(project(":compose:remote:remote-player-core"))
    implementation("androidx.core:core-remoteviews:1.1.0")
    implementation("androidx.compose.foundation:foundation-layout:1.12.0")
    implementation("androidx.compose.ui:ui:1.12.0")
    implementation("androidx.compose.foundation:foundation:1.12.0")
    implementation("androidx.compose.runtime:runtime:1.12.0")
    implementation("androidx.compose.ui:ui-tooling:1.12.0")
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.profileinstaller:profileinstaller:1.4.1")
    implementation(project(":tracing:tracing"))
    implementation("androidx.compose.material3:material3:1.4.0")

}
