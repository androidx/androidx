import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.application")
    id("AndroidXComposePlugin")
}

androidx {
    name = "Remote Compose Player Embedded Integration Tests"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description = "Integration tests and previews for the experimental Compose embedded player"
    addGoldenImageAssets()
    enableRobolectric()
}

android {
    namespace = "androidx.compose.remote.player.compose.embedded.integration"
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig {
        minSdk { version = release(29) }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    sourceSets {
        test {
            kotlin.srcDirs += [file("src/sharedTest/java")]
        }
        androidTest {
            kotlin.srcDirs += [file("src/sharedTest/java")]
        }
    }
}

dependencies {
    // Core player dependencies
    implementation(project(":compose:remote:remote-core"))
    implementation(project(":compose:remote:remote-player-core"))
    implementation(project(":compose:remote:remote-player-view"))
    implementation(project(":compose:remote:remote-player-compose"))
    implementation(project(":compose:remote:remote-tooling-preview"))
    implementation(libs.androidx.core)
    implementation("androidx.concurrent:concurrent-futures:1.3.0")
    implementation("androidx.concurrent:concurrent-futures-ktx:1.3.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.compose.foundation:foundation:1.12.0")
    implementation("androidx.compose.material3:material3:1.3.1")
    implementation("androidx.compose.ui:ui:1.12.0")
    implementation("androidx.compose.ui:ui-text-google-fonts:1.12.0")
    implementation("androidx.tracing:tracing-ktx:1.3.0")
    implementation("androidx.activity:activity-compose:1.9.0")

    // Wear Material3 dependencies (needed for the Wear previews we are moving here!)
    implementation(project(":wear:compose:remote:remote-material3"))
    implementation(project(":wear:compose:remote:remote-material3-samples"))
    implementation("androidx.wear.compose:compose-foundation:1.5.5")
    implementation("androidx.wear.compose:compose-material3:1.5.5")
    implementation("androidx.wear.compose:compose-ui-tooling:1.5.5")
    implementation("androidx.wear:wear-tooling-preview:1.0.0")

    // Tooling/Creation dependencies (needed by the player and tests)
    implementation(project(":compose:remote:remote-creation"))
    implementation(project(":compose:remote:remote-creation-compose"))
    implementation("androidx.compose.ui:ui-tooling:1.12.0")
    implementation("androidx.compose.ui:ui-tooling-preview:1.12.0")

    // Testing dependencies
    androidTestImplementation(project(":compose:remote:remote-testing"))
    androidTestImplementation(project(":compose:remote:remote-player-compose-testutils"))
    androidTestImplementation(project(":compose:remote:remote-core-testutils"))
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.12.0")
    androidTestImplementation("androidx.concurrent:concurrent-futures:1.3.0")
    androidTestImplementation("androidx.concurrent:concurrent-futures-ktx:1.3.0")
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.junit)


    testImplementation(project(":compose:remote:remote-creation"))
    testImplementation(project(":compose:remote:remote-creation-compose"))
    testImplementation(project(":compose:remote:remote-testing"))
    testImplementation("androidx.compose.ui:ui-test:1.12.0")
    testImplementation("androidx.compose.ui:ui-test-junit4:1.12.0")
