import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.application")
}

android {
    namespace = "androidx.xr.projected.integration.tests"
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId = "androidx.xr.projected.integration.tests"
        minSdk { version = release(36) }
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

androidx {
    name = "JXR Projected Integration Tests"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description =
        "Automated instrumented integration tests for JXR Projected to run in CI and on " +
            "paired emulators/devices."
    deviceTests {
        maxShardCount = 1
    }
}

dependencies {
    implementation(project(":xr:projected:projected"))

    implementation("androidx.activity:activity:1.12.1")

    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testCore)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.truth)
}
