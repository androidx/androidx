import androidx.build.SoftwareType

plugins {
    id("com.android.application")
    id("AndroidXPlugin")
}

android {
    namespace = "androidx.xr.arcore.integration.tests"
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId = "androidx.xr.arcore.integration.tests"
        minSdk { version = release(34) }
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

androidx {
    name = "JXR ARCore Integration Tests App"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description =
        "Automated instrumented integration tests for JXR ARCore to run in CI and on " +
            "emulators/devices."
}

dependencies {
    // Project dependencies
    implementation(project(":xr:arcore:arcore"))
    implementation(project(":xr:arcore:arcore-openxr"))
    implementation(project(":xr:arcore:arcore-runtime"))
    implementation(project(":xr:runtime:runtime"))
    implementation(project(":xr:scenecore:scenecore"))

    // External dependencies
    implementation(libs.kotlinCoroutinesGuava)
    implementation("androidx.activity:activity:1.9.3")
    implementation("androidx.annotation:annotation:1.9.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.lifecycle:lifecycle-runtime:2.8.7")

    compileOnly(libs.androidExtensionsXr)

    // Test dependencies
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.truth)
    androidTestImplementation(project(":xr:testutils"))

    androidTestUtil(libs.testOrchestrator)
}
