plugins {
    id("AndroidXPlugin")
    id("com.android.test")
}

android {
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    namespace = "androidx.xr.scenecore.releasetests"
    defaultConfig {
        minSdk { version = release(34) }
    }
    targetProjectPath = ":xr:scenecore:integration-tests:xr-integration-tests"
    // The test APK instruments itself and drives the (non-debuggable, R8-optimized) target app
    // out-of-process via UiAutomator.
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

// Create a release build type and make sure it's the only one enabled.
// This is needed because we only test against the optimized release build of the target app.
android.buildTypes { release {} }
androidComponents { beforeVariants(selector().all()) { enabled = buildType == "release" } }

dependencies {
    implementation(libs.junit)
    implementation(libs.testExtJunit)
    implementation(libs.testCore)
    implementation(libs.testRunner)
    implementation(libs.testUiautomator)
    implementation(project(":xr:testutils"))
}
