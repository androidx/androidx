import androidx.build.AndroidXConfig
import androidx.build.ApkCopyHelperKt
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("com.android.application")
}

android {
    namespace = "androidx.xr.scenecore.integration.tests"
    compileSdk { version = release(37) }

    defaultConfig {
        applicationId = "androidx.xr.scenecore.integration.tests"
        minSdk { version = release(34) }
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

androidx {
    name = "JXR SceneCore Integration Tests App"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description = "Integration tests app for JXR SceneCore."
}

dependencies {
    implementation(project(":xr:runtime:runtime"))
    implementation(project(":xr:scenecore:scenecore"))
    implementation(project(":xr:scenecore:scenecore-spatial-core"))
    implementation(project(":xr:scenecore:scenecore-spatial-rendering"))
    implementation(project(":xr:arcore:arcore"))
    implementation(project(":xr:arcore:arcore-openxr"))

    implementation("androidx.activity:activity:1.10.1")
    implementation("androidx.core:core-ktx:1.16.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.9.0")

    compileOnly(libs.androidExtensionsXr)

    // Test dependencies
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.truth)
    androidTestImplementation(project(":xr:testutils"))

    androidTestUtil(libs.testOrchestrator)
}

ApkCopyHelperKt.setupAppApkCopy(project, "release")
