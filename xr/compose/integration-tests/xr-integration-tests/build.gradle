import androidx.build.SoftwareType

plugins {
    id("com.android.application")
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
}

android {
    namespace = "androidx.xr.compose.integration.tests"
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId = "androidx.xr.compose.integration.tests"
        minSdk { version = release(34) }
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

androidx {
    name = "JXR Compose Integration Tests App"
    type = SoftwareType.TEST_APPLICATION
    inceptionYear = "2026"
    description = "Integration tests app for JXR Compose."
}

dependencies {
    // Project dependencies
    implementation(project(":compose:material3:material3"))
    implementation(project(":xr:compose:compose"))
    implementation(project(":xr:assets"))
    implementation(project(":xr:compose:material3:material3"))
    implementation(project(":xr:runtime:runtime"))
    implementation(project(":xr:arcore:arcore-openxr"))
    implementation(project(":xr:scenecore:scenecore"))
    implementation(project(":xr:scenecore:scenecore-spatial-core"))
    implementation(project(":xr:scenecore:scenecore-spatial-rendering"))
    implementation(project(":xr:arcore:arcore"))

    // Compose projects
    implementation(project(":compose:ui:ui"))
    implementation(project(":compose:ui:ui-tooling-preview"))
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:foundation:foundation"))

    // External dependencies
    implementation("androidx.activity:activity-compose:1.10.0")
    implementation("androidx.annotation:annotation:1.9.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.compose.material:material-icons-extended:1.7.8")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.fragment:fragment-ktx:1.8.1")
    implementation("com.google.android.material:material:1.12.0")

    compileOnly(libs.androidExtensionsXr)

    // Test dependencies
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.7.0")
    androidTestImplementation("androidx.compose.ui:ui-test:1.7.0")
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.truth)
    androidTestImplementation(project(":test:screenshot:screenshot"))
    androidTestImplementation(project(":xr:testutils"))
    androidTestImplementation(project(":xr:compose:compose-testing"))

    // Aligned project dependencies for tests required by AndroidX DependencyAlignmentPlugin
    androidTestImplementation(project(":compose:runtime:runtime"))
    androidTestImplementation(project(":compose:runtime:runtime-annotation"))
    androidTestImplementation(project(":compose:runtime:runtime-saveable"))
    androidTestImplementation(project(":compose:ui:ui-graphics"))
    androidTestImplementation(project(":compose:ui:ui-unit"))
    androidTestImplementation(project(":compose:ui:ui-geometry"))
    androidTestImplementation(project(":compose:ui:ui-util"))
    androidTestImplementation(project(":compose:ui:ui-text"))
    androidTestImplementation(project(":compose:animation:animation-core"))
    androidTestImplementation(project(":compose:animation:animation"))
    androidTestImplementation(project(":compose:foundation:foundation-layout"))
    androidTestImplementation(project(":compose:foundation:foundation"))
    androidTestImplementation(project(":xr:scenecore:scenecore"))

    androidTestUtil(libs.testOrchestrator)
}
