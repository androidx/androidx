plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.application")
}

androidComponents { beforeVariants(selector().all()) { enabled = buildType == 'release' } }

android {
    namespace = "androidx.xr.glimmer.macrobenchmark.target"
    compileSdk { version = release(37) }

    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
}

dependencies {
    implementation(libs.androidx.activity.compose)
    implementation(project(":appcompat:appcompat"))
    implementation(project(":compose:foundation:foundation"))
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation(project(":xr:glimmer:glimmer"))
    implementation(project(":xr:glimmer:glimmer-google-fonts"))
}
