import com.android.build.api.variant.ApplicationVariant
import javax.inject.Inject
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.Optional
import org.gradle.api.tasks.TaskAction
import org.gradle.process.ExecOperations

abstract class BaseXrStagedGoldensTask extends DefaultTask {
    protected static final String SAVED_STATE_FILE = "/data/local/tmp/androidx_xr_saved_state"

    protected static final List<String> XR_PROPS = [
        "persist.xr.frames_host.drop_far_event",
        "persist.xr.disable_don_doff_sensor",
        "xr.power.don",
        "cpm.fake_headtracking",
        "xr.pose_read_mode",
        "cpm.fake_het_position",
        "cpm.fake_het_orientation",
        "cpm.disable_capture_stabilization",
    ]

    protected static final List<String> XR_SETTINGS = [
        "global:device_provisioned",
        "secure:user_setup_complete",
        "global:stay_on_while_plugged_in",
        "system:screen_off_timeout",
        "system:doff_screen_timeout_ms",
        "secure:guardian_requires_setup",
        "secure:guardian_consent_granted",
    ]

    protected static String shellQuote(String value) {
        def safe = value ?: ""
        return "'" + safe.replace("'", "'\\''") + "'"
    }

    @Inject
    abstract ExecOperations getExecOperations()

    @Input
    abstract Property<String> getAdbPath()

    @Input
    abstract ListProperty<String> getApplicationIds()

    @Optional
    @Input
    abstract Property<String> getAndroidSerial()

    @Optional
    @Input
    abstract Property<String> getModuleRelativePath()

    BaseXrStagedGoldensTask() {
        outputs.upToDateWhen { false }
    }

    protected List<String> remoteStagedGoldensDirs() {
        def modulePath = moduleRelativePath.orNull
        def subPath = modulePath != null && !modulePath.isEmpty() ? "/${modulePath}" : ""
        return new LinkedHashSet<>(applicationIds.get()).collect { appId ->
            "/sdcard/Android/data/${appId}/cache/androidx_screenshots/goldens${subPath}"
        }
    }

    protected List<String> resolveTargetSerials() {
        def explicitSerial = androidSerial.orNull
        if (explicitSerial != null && !explicitSerial.isEmpty()) {
            return [explicitSerial]
        }
        def baos = new ByteArrayOutputStream()
        execOperations.exec { spec ->
            spec.commandLine(adbPath.get(), "devices")
            spec.standardOutput = baos
        }
        return baos.toString("UTF-8")
            .readLines()
            .drop(1)
            .collect { it.trim() }
            .findAll { it.endsWith("\tdevice") || it.endsWith(" device") }
            .collect { it.split(/\s+/)[0] }
            .findAll { !it.isEmpty() }
    }

    protected String runAdbShell(String serial, String script) {
        def baos = new ByteArrayOutputStream()
        execOperations.exec { spec ->
            spec.commandLine(adbPath.get(), "-s", serial, "shell", script)
            spec.standardOutput = baos
            spec.errorOutput = baos
            spec.ignoreExitValue = true
        }
        return baos.toString("UTF-8").trim()
    }

    protected void ensureAdbRoot(String serial) {
        execOperations.exec { spec ->
            spec.commandLine(adbPath.get(), "-s", serial, "root")
            spec.ignoreExitValue = true
        }
        execOperations.exec { spec ->
            spec.commandLine(adbPath.get(), "-s", serial, "wait-for-device")
            spec.ignoreExitValue = true
        }
    }

    protected boolean isXrDevice(String serial) {
        def features = runAdbShell(serial, "pm list features")
        return features.contains("android.software.xr.") ||
            features.contains("com.google.android.feature.XR")
    }

    protected void ensureDeviceOnline(String serial) {
        if (serial.contains(":")) {
            execOperations.exec { spec ->
                spec.commandLine(adbPath.get(), "connect", serial)
                spec.ignoreExitValue = true
            }
        }
        execOperations.exec { spec ->
            spec.commandLine(adbPath.get(), "-s", serial, "wait-for-device")
            spec.ignoreExitValue = true
        }
    }

    protected void restartAndWaitForXrBoot(
        String serial,
        int settleSeconds = 0,
        boolean failOnTimeout = false
    ) {
        def hadSysUiReady = !runAdbShell(serial, "getprop xr.stats.sysui_ready_ts_ms").isEmpty()
        def clearSysUiReady = hadSysUiReady ? "setprop xr.stats.sysui_ready_ts_ms '' && " : ""
        runAdbShell(
            serial,
            "setprop sys.boot_completed 0 && " +
                clearSysUiReady +
                "setprop xr.stats.splash_screen_hide_ts_ms '' && " +
                "stop && start"
        )
        Thread.sleep(2000)
        ensureDeviceOnline(serial)

        def ready = false
        for (int i = 0; i < 60; i++) {
            def bootCompleted = runAdbShell(serial, "getprop sys.boot_completed")
            def sysuiReady = !hadSysUiReady ||
                !runAdbShell(serial, "getprop xr.stats.sysui_ready_ts_ms").isEmpty()
            def pkgCheck = runAdbShell(serial, "service check package")
            def actCheck = runAdbShell(serial, "service check activity")
            def cpmCheck = runAdbShell(serial, "service check spf_cpm")
            if (bootCompleted == "1" && sysuiReady &&
                pkgCheck.contains("found") && actCheck.contains("found") && cpmCheck.contains("found")) {
                ready = true
                break
            }
            Thread.sleep(1000)
            if (serial.contains(":")) {
                ensureDeviceOnline(serial)
            }
        }
        if (!ready) {
            if (failOnTimeout) {
                throw new GradleException("XR device $serial not ready after restart")
            }
            logger.warn("XR device $serial not ready after restart")
        }
        if (settleSeconds > 0) {
            Thread.sleep(settleSeconds * 1000L)
        }
        ensureDeviceOnline(serial)
    }

    protected void restoreDevice(String serial) {
        ensureDeviceOnline(serial)
        ensureAdbRoot(serial)
        def isPuckWithFrames =
            runAdbShell(serial, "getprop xr.device.config.frame_puck_protocol") == "true"
        def savedState = loadDeviceState(serial)

        Map<String, String> defaultProps = [
            "persist.xr.frames_host.drop_far_event": "false",
            "persist.xr.disable_don_doff_sensor": "false",
            "xr.power.don": "",
            "cpm.fake_headtracking": "",
            "xr.pose_read_mode": "2",
            "cpm.fake_het_position": "",
            "cpm.fake_het_orientation": "",
            "cpm.disable_capture_stabilization": "false",
        ]
        def propsToRestore = new ArrayList<String>(XR_PROPS)
        if (isPuckWithFrames) {
            defaultProps["persist.xr.enable_dynamic_sensor"] = "true"
            propsToRestore.add(0, "persist.xr.enable_dynamic_sensor")
        }

        def propCommands = propsToRestore.collect { prop ->
            def savedVal = savedState["prop:" + prop]
            def val = (savedVal != null && !savedVal.isEmpty()) ? savedVal : defaultProps[prop]
            "setprop ${prop} ${shellQuote(val)}"
        }

        def wmDensityOverride = savedState["wm_density_override"] ?: ""
        def wmDensityCommand = wmDensityOverride.isEmpty() ?
            "wm density reset" : "wm density ${shellQuote(wmDensityOverride)}"

        runAdbShell(
            serial,
            "pm enable com.google.android.apps.vr.wiredmirror >/dev/null 2>&1 || true; " +
                propCommands.join(" && ") + " && " +
                wmDensityCommand
        )

        restartAndWaitForXrBoot(serial)

        def postBootCommands = new ArrayList<String>(propCommands)
        postBootCommands.add("pm enable com.google.android.apps.vr.wiredmirror >/dev/null 2>&1 || true")
        postBootCommands.add("svc power stayon false")
        XR_SETTINGS.each { entry ->
            def settingKey = "setting:" + entry
            if (savedState.containsKey(settingKey)) {
                def parts = entry.split(":", 2)
                def namespace = parts[0]
                def key = parts[1]
                def val = savedState[settingKey]
                if (val == null || val.isEmpty() || val == "null") {
                    postBootCommands.add("settings delete ${namespace} ${key} >/dev/null 2>&1 || true")
                } else {
                    postBootCommands.add("settings put ${namespace} ${key} ${shellQuote(val)}")
                }
            }
        }
        postBootCommands.add("cmd XrServiceHelperService sensor-data-injection disable >/dev/null 2>&1 || true")
        postBootCommands.add("rm -f ${SAVED_STATE_FILE}")

        runAdbShell(serial, postBootCommands.join("; "))
        ensureDeviceOnline(serial)
    }

    protected void saveDeviceState(String serial, boolean isPuckWithFrames) {
        def propsToSave = new ArrayList<String>(XR_PROPS)
        if (isPuckWithFrames) {
            propsToSave.add(0, "persist.xr.enable_dynamic_sensor")
        }
        def commands = [
            "echo \"wm_density_override=\$(wm density 2>/dev/null | sed -n 's/.*Override density: *//p')\"",
        ]
        propsToSave.each { prop ->
            commands.add("echo \"prop:${prop}=\$(getprop ${prop})\"")
        }
        XR_SETTINGS.each { entry ->
            def parts = entry.split(":", 2)
            def namespace = parts[0]
            def key = parts[1]
            commands.add("echo \"setting:${namespace}:${key}=\$(settings get ${namespace} ${key})\"")
        }
        def tmpFile = "${SAVED_STATE_FILE}.tmp"
        runAdbShell(
            serial,
            "if [ ! -f ${SAVED_STATE_FILE} ]; then " +
                "{ " + commands.join("; ") + "; } > ${tmpFile} && " +
                "mv ${tmpFile} ${SAVED_STATE_FILE}; " +
                "fi"
        )
    }

    protected Map<String, String> loadDeviceState(String serial) {
        def content = runAdbShell(serial, "cat ${SAVED_STATE_FILE} 2>/dev/null || true")
        Map<String, String> state = [:]
        if (content.isEmpty()) {
            return state
        }
        content.readLines().each { line ->
            def idx = line.indexOf('=')
            if (idx > 0) {
                def key = line.substring(0, idx).trim()
                def value = line.substring(idx + 1).trim()
                state[key] = value
            }
        }
        return state
    }
}

abstract class PrepareXrDeviceTask extends BaseXrStagedGoldensTask {
    @TaskAction
    void prepare() {
        for (def serial : resolveTargetSerials()) {
            if (!isXrDevice(serial)) {
                continue
            }
            ensureDeviceOnline(serial)
            ensureAdbRoot(serial)
            def isPuckWithFrames =
                runAdbShell(serial, "getprop xr.device.config.frame_puck_protocol") == "true"
            saveDeviceState(serial, isPuckWithFrames)
            try {
                if (isPuckWithFrames) {
                    runAdbShell(
                        serial,
                        "if [ -f /sys/class/qcom-battery/c1_otg_enable ] && " +
                            "[ -z \"\$(dumpsys display | grep 'HDMI Screen')\" ]; then " +
                            "echo 0 > /sys/class/qcom-battery/c1_otg_enable && sleep 2 && " +
                            "echo 1 > /sys/class/qcom-battery/c1_otg_enable && " +
                            "for i in \$(seq 1 20); do " +
                            "if [ -n \"\$(dumpsys display | grep 'HDMI Screen')\" ]; then break; fi; " +
                            "sleep 1; done; fi"
                    )
                }

                def dynSensorCommand =
                    isPuckWithFrames ? "setprop persist.xr.enable_dynamic_sensor false && " : ""
                runAdbShell(
                    serial,
                    "pm disable-user --user 0 com.google.android.apps.vr.wiredmirror >/dev/null 2>&1 || true; " +
                        dynSensorCommand +
                        "setprop persist.xr.frames_host.drop_far_event true && " +
                        "setprop persist.xr.disable_don_doff_sensor true && " +
                        "setprop xr.power.don true && " +
                        "setprop cpm.fake_headtracking true && " +
                        "setprop xr.pose_read_mode 0 && " +
                        "setprop cpm.fake_het_position '0.0,0.0,0.0' && " +
                        "setprop cpm.fake_het_orientation '0.0,0.0,0.0,1.0' && " +
                        "setprop cpm.disable_capture_stabilization true"
                )

                restartAndWaitForXrBoot(serial, 5, true)

                runAdbShell(
                    serial,
                    "setprop xr.power.don true && " +
                        "setprop cpm.fake_headtracking true && " +
                        "setprop xr.pose_read_mode 0 && " +
                        "setprop cpm.fake_het_position '0.0,0.0,0.0' && " +
                        "setprop cpm.fake_het_orientation '0.0,0.0,0.0,1.0' && " +
                        "setprop cpm.disable_capture_stabilization true && " +
                        "wm density 160 && " +
                        "settings put global device_provisioned 1 && " +
                        "settings put secure user_setup_complete 1 && " +
                        "settings put global stay_on_while_plugged_in 15 && " +
                        "settings put system screen_off_timeout 1800000 && " +
                        "settings put system doff_screen_timeout_ms 1800000 && " +
                        "settings put secure guardian_requires_setup 0 && " +
                        "settings put secure guardian_consent_granted 1 && " +
                        "svc power stayon true && " +
                        "input keyevent KEYCODE_WAKEUP && " +
                        "wm dismiss-keyguard && " +
                        "dumpsys sensorservice hal_bypass_replay_data_injection android >/dev/null 2>&1 || true; " +
                        "cmd XrServiceHelperService sensor-data-injection enable >/dev/null 2>&1 || true; " +
                        "cmd XrServiceHelperService offbody false >/dev/null 2>&1 || true; " +
                        "if command -v frames_test >/dev/null 2>&1; then " +
                        "frames_test inject-offbody-sensor-event --value 1 >/dev/null 2>&1 || true; " +
                        "fi"
                )
                ensureDeviceOnline(serial)
            } catch (Throwable t) {
                logger.error("Failed to prepare XR device $serial; restoring device state", t)
                try {
                    restoreDevice(serial)
                } catch (Throwable restoreError) {
                    logger.error(
                        "Failed to restore XR device $serial after prepare failure",
                        restoreError
                    )
                }
                throw t
            }
        }
    }
}

abstract class RestoreXrDeviceTask extends BaseXrStagedGoldensTask {
    @TaskAction
    void restore() {
        for (def serial : resolveTargetSerials()) {
            if (!isXrDevice(serial)) {
                continue
            }
            restoreDevice(serial)
        }
    }
}

abstract class ClearStagedXrGoldensTask extends BaseXrStagedGoldensTask {
    @TaskAction
    void clear() {
        for (def serial : resolveTargetSerials()) {
            execOperations.exec { spec ->
                spec.commandLine(adbPath.get(), "-s", serial, "wait-for-device")
                spec.ignoreExitValue = true
            }
            for (def appId : new LinkedHashSet<>(applicationIds.get())) {
                def rootGoldensDir = "/sdcard/Android/data/${appId}/cache/androidx_screenshots/goldens"
                execOperations.exec { spec ->
                    spec.commandLine(adbPath.get(), "-s", serial, "shell", "rm", "-rf", rootGoldensDir)
                    spec.ignoreExitValue = true
                }
            }
        }
    }
}

abstract class PullStagedXrGoldensTask extends BaseXrStagedGoldensTask {
    @Internal
    abstract DirectoryProperty getGoldenRepoDir()

    @TaskAction
    void pull() {
        def goldenDir = goldenRepoDir.get().asFile
        if (!goldenDir.exists()) {
            logger.warn(
                "Golden repository directory does not exist at ${goldenDir.absolutePath}; " +
                    "skipping adb pull."
            )
            return
        }
        def modulePath = moduleRelativePath.orNull
        def targetGoldenDir = modulePath != null && !modulePath.isEmpty() ?
            new File(goldenDir, modulePath) : goldenDir
        def remoteDirs = remoteStagedGoldensDirs()
        for (def serial : resolveTargetSerials()) {
            for (def remoteDir : remoteDirs) {
                def checkResult = execOperations.exec { spec ->
                    spec.commandLine(adbPath.get(), "-s", serial, "shell", "test", "-d", remoteDir)
                    spec.ignoreExitValue = true
                }
                if (checkResult.exitValue == 0) {
                    targetGoldenDir.mkdirs()
                    execOperations.exec { spec ->
                        spec.commandLine(
                            adbPath.get(),
                            "-s",
                            serial,
                            "pull",
                            "${remoteDir}/.",
                            targetGoldenDir.absolutePath
                        )
                    }
                    execOperations.exec { spec ->
                        spec.commandLine(adbPath.get(), "-s", serial, "shell", "rm", "-rf", remoteDir)
                        spec.ignoreExitValue = true
                    }
                }
            }
        }
    }
}

def updateGoldensEnabled = providers
    .gradleProperty("android.testInstrumentationRunnerArguments.updateGoldens")
    .map { it.toBoolean() }
    .orElse(false)

def goldenRepoDirectory = layout.projectDirectory.dir(
    new File(rootDir, "../../golden").canonicalPath
)

androidComponents {
    onVariants(selector().all()) { variant ->
        def androidTest = variant.androidTest
        if (androidTest != null) {
            def variantName = variant.name.capitalize()
            def adbProvider = sdkComponents.adb.map { it.asFile.absolutePath }
            def serialProvider = providers.environmentVariable("ANDROID_SERIAL")
            def modulePath = project.projectDir.canonicalPath
                .replace(project.rootDir.canonicalPath + File.separator, "")
            def appIds = [androidTest.applicationId]
            if (variant instanceof ApplicationVariant) {
                appIds.add(variant.applicationId)
            }

            def prepareTask = tasks.register(
                "prepareXrDevice${variantName}",
                PrepareXrDeviceTask
            ) { task ->
                task.adbPath.set(adbProvider)
                appIds.each { task.applicationIds.add(it) }
                task.androidSerial.set(serialProvider)
                task.moduleRelativePath.set(modulePath)
            }

            def restoreTask = tasks.register(
                "restoreXrDevice${variantName}",
                RestoreXrDeviceTask
            ) { task ->
                task.adbPath.set(adbProvider)
                appIds.each { task.applicationIds.add(it) }
                task.androidSerial.set(serialProvider)
                task.moduleRelativePath.set(modulePath)
            }

            def clearTask = tasks.register(
                "clearStagedXrGoldens${variantName}",
                ClearStagedXrGoldensTask
            ) { task ->
                task.adbPath.set(adbProvider)
                appIds.each { task.applicationIds.add(it) }
                task.androidSerial.set(serialProvider)
                task.moduleRelativePath.set(modulePath)
                task.mustRunAfter(prepareTask)
            }

            def pullTask = tasks.register(
                "pullStagedXrGoldens${variantName}",
                PullStagedXrGoldensTask
            ) { task ->
                task.adbPath.set(adbProvider)
                appIds.each { task.applicationIds.add(it) }
                task.androidSerial.set(serialProvider)
                task.moduleRelativePath.set(modulePath)
                task.goldenRepoDir.set(goldenRepoDirectory)
            }

            restoreTask.configure { task ->
                task.mustRunAfter(prepareTask)
                task.mustRunAfter(pullTask)
            }

            tasks.matching { it.name == "connected${variantName}AndroidTest" }
                .configureEach { connectedTask ->
                    connectedTask.dependsOn(prepareTask)
                    connectedTask.finalizedBy(restoreTask)
                    if (updateGoldensEnabled.get()) {
                        connectedTask.dependsOn(clearTask)
                        connectedTask.finalizedBy(pullTask)
                    }
                }
        }
    }
}
