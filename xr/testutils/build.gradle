import androidx.build.AndroidXConfig
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("com.android.library")
}

dependencies {
    api(libs.junit)
    api(libs.testRunner)
    api(libs.testRules)
    api(libs.testCore)
    api(libs.testExtJunit)
    api(libs.kotlinTest)
    api("androidx.activity:activity:1.9.3")
    api("androidx.compose.animation:animation-core:1.7.5")
    api("androidx.lifecycle:lifecycle-common:2.11.1")
    api(project(":xr:runtime:runtime"))
    api(project(":xr:runtime:runtime-manifest"))

    api(project(":test:screenshot:screenshot"))
    implementation("androidx.compose.runtime:runtime:1.7.5")
    implementation(libs.kotlinCoroutinesAndroid)

    androidTestImplementation("androidx.compose.foundation:foundation:1.13.0")
    androidTestImplementation("androidx.compose.material3:material3:1.5.0")
    androidTestImplementation("androidx.compose.ui:ui:1.13.0")
    androidTestImplementation("androidx.compose.ui:ui-test:1.13.0")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.13.0")
    androidTestImplementation(project(":xr:compose:compose"))
    androidTestImplementation(libs.androidx.activity.compose)
    androidTestImplementation(libs.testUiautomator)
}

android {
    compileSdk { version = release(37) }
    namespace = "androidx.xr.testutils"
}

androidComponents {
    def cliAssetsPath = new File(AndroidXConfig.getPrebuiltsRoot(project), "androidx/xr/cli")
            .absolutePath

    onVariants(selector().all()) { variant ->
        if (new File(cliAssetsPath).exists()) {
            variant.sources.assets.addStaticSourceDirectory(cliAssetsPath)
        }
    }
}

androidx {
    name = "XR Test Utilities"
    type = SoftwareType.INTERNAL_TEST_LIBRARY
    inceptionYear = "2026"
    description = "Internal test utilities for XR libraries."
    enableRobolectric()
    additionalDeviceTestTags.add("xr_optin")
}

apply from: "$rootDir/xr/testutils/xr-device-tests.gradle"
