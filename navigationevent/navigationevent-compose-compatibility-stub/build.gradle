import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        compileSdk = 36
        namespace = "androidx.navigationevent.compose"
    }
    desktop()
    mac()
    linux()
    ios()
    watchos()
    tvos()
    mingwX64()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        def navigationEventVersion = project.findProperty('artifactRedirection.version.androidx.navigationevent')

        commonMain.dependencies {
            api("androidx.navigationevent:navigationevent-compose:$navigationEventVersion")

            // Keep direct references to fork versions to correctly resolve
            // new redirections to Google's artifacts.
            api(project(":compose:runtime:runtime"))
        }

    }
}

androidx {
    name = "NavigationEvent Compose"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2025"
    description = "Compose integration with NavigationEvent"
}
