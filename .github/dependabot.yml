# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules in repo root (add more directories if needed)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used in this repo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep existing ecosystems below if still relevant. Adjust as needed.
  - package-ecosystem: "npm"
    directory: "/development/benchmarks-chrome-extension"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/development/fetchLicenses"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/development/plot-benchmarks"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/development/project-creator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/kotlin-js-store/wasm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/kotlin-js-store"
    schedule:
      interval: "weekly"
