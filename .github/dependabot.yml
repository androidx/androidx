# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
    
      interval: "weekly"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /development/benchmarks-chrome-extension
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /development/fetchLicenses
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /development/plot-benchmarks
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /development/project-creator
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /kotlin-js-store/wasm
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /kotlin-js-store
    schedule:
      interval: daily
