# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
  pull_request:
  schedule:
    - cron: '42 18 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    - name: Setup Java
      if: matrix.language == 'swift'
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make gradlew executable
      if: matrix.language == 'swift'
      run: chmod +x ./gradlew

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@16140ae1a102900babc80a33c44059580f687047 # v4.30.9
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix['build-mode'] }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: ${{ matrix['build-mode'] == 'manual' && matrix.language == 'swift' }}
      shell: bash
      run: |
        echo "Building Swift projects with manual build steps..."
        
        # Install XcodeGen if not already available
        if ! command -v xcodegen &> /dev/null; then
          echo "Installing XcodeGen..."
          brew install xcodegen
        fi
        
        # Build the required XCFrameworks first
        echo "Building XCFrameworks..."
        ./gradlew :tracing:tracing:embedAndSignAppleFrameworkForXcode --no-daemon
        
        # Build benchmark XCFrameworks
        ./gradlew :benchmark:benchmark-darwin:assembleAndroidXDarwinBenchmarksReleaseXCFramework --no-daemon
        
        # Generate Xcode projects for Swift code analysis
        echo "Generating Xcode projects..."
        
        # For tracing testapp-darwin
        cd tracing/integration-tests/testapp-darwin
        if [ -f "xcodegen.yml" ]; then
          xcodegen generate
          echo "Generated Xcode project for tracing testapp-darwin"
          
          # Build the Xcode project to ensure it compiles
          if [ -d "testapp-darwin.xcodeproj" ]; then
            xcodebuild -project testapp-darwin.xcodeproj -scheme App -configuration Debug build
            echo "Built tracing testapp-darwin project"
          fi
        fi
        cd ../../..
        
        # For benchmark projects
        cd benchmark/benchmark-darwin-xcode
        if [ -f "projects/collection-benchmark-ios.yml" ]; then
          xcodegen generate --spec projects/collection-benchmark-ios.yml
          echo "Generated Xcode project for collection-benchmark-ios"
          
          # Build the Xcode project to ensure it compiles
          if [ -d "collection-benchmark-ios.xcodeproj" ]; then
            xcodebuild -project collection-benchmark-ios.xcodeproj -scheme testapp-ios -configuration Debug build
            echo "Built collection-benchmark-ios project"
          fi
        fi
        if [ -f "projects/benchmark-darwin-samples-xcode.yml" ]; then
          xcodegen generate --spec projects/benchmark-darwin-samples-xcode.yml
          echo "Generated Xcode project for benchmark-darwin-samples-xcode"
          
          # Build the Xcode project to ensure it compiles
          if [ -d "benchmark-darwin-samples-xcode.xcodeproj" ]; then
            xcodebuild -project benchmark-darwin-samples-xcode.xcodeproj -scheme testapp-ios -configuration Debug build
            echo "Built benchmark-darwin-samples-xcode project"
          fi
        fi
        cd ../..
        
        echo "Swift build preparation completed successfully"

    - if: ${{ matrix['build-mode'] == 'manual' && matrix.language != 'swift' }}
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@16140ae1a102900babc80a33c44059580f687047 # v4.30.9
      with:
        category: "/language:${{matrix.language}}"

    - name: Add failure summary to job summary
      if: ${{ failure() }}
      shell: bash
      run: |
        {
          echo "## CodeQL Advanced: Analysis failed";
          echo "";
          echo "**Language**: ${{ matrix.language }}";
          echo "**Build mode**: ${{ matrix['build-mode'] }}";
          echo "**Runner OS**: ${{ runner.os }}";
          echo "";
          echo "### What likely happened";
          echo "- For compiled languages, the autobuild may not have detected your build."
          echo "- Required toolchains or dependencies may be missing on the runner.";
          echo "";
          echo "### Next steps";
          echo "- Review logs for the 'Initialize CodeQL' and 'Perform CodeQL Analysis' steps.";
          echo "- If autobuild failed, set 'build-mode' to 'manual' for this language and add explicit build steps in the workflow.";
          echo "- See the docs for customizing builds for compiled languages: https://gh.io/codeql-code-scanning-for-compiled-languages";
          echo "";
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}";
        } >> "$GITHUB_STEP_SUMMARY"
