name: "Prune old artifacts"
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  actions: write
  contents: read

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 7days

