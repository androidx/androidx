import androidx.build.SoftwareType
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("AndroidXPlugin")
    id("com.android.library")
}

dependencies {
    implementation(libs.kotlinCoroutinesAndroid)
    implementation("androidx.annotation:annotation-experimental:1.4.1")
    implementation("androidx.core:core:1.8.0")
    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testCore)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.testRules)
    androidTestImplementation("androidx.lifecycle:lifecycle-common:2.8.3")
    androidTestImplementation("androidx.test:core:1.4.0@aar")
}

android {
    compileSdk { version = release(35) }
    namespace = "androidx.graphics.core"
}

androidXNative {
    def nativeCompilation = createNativeCompilation("graphics-core") {
        configureEachTarget { targetCompilation ->
            targetCompilation.sources.from(
                file("src/main/cpp/graphics-core.cpp"),
                file("src/main/cpp/egl_utils.cpp"),
                file("src/main/cpp/sync_fence.cpp"),
                file("src/main/cpp/sc_test_utils.cpp")
            )
            targetCompilation.freeArgs.addAll(
                "-D__ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__",
                "-Oz",
                "-fvisibility=hidden",
                "-flto",
                "-fPIC",
                "-fno-exceptions",
                "-fno-rtti",
                "-fomit-frame-pointer",
                "-fdata-sections",
                "-ffunction-sections"
            )
            targetCompilation.linkerArgs.addAll(
                "-Wl,--gc-sections",
                "-Wl,--version-script=${file("src/main/cpp/jni.lds").absolutePath}",
                "-Wl,--undefined-version",
                "-llog",
                "-lEGL",
                "-lGLESv2",
                "-landroid"
            )
        }
    }
    addNativeLibrariesToJniLibs(nativeCompilation)
}

androidx {
    name = "Graphics Core"
    type = SoftwareType.PUBLISHED_LIBRARY
    mavenVersion = LibraryVersions.GRAPHICS_CORE
    inceptionYear = "2021"
    description = "Leverage graphics facilities across multiple Android platform releases"
    legacyDisableKotlinStrictApiMode = true
    samples(project(":graphics:graphics-core:graphics-core-samples"))
    deviceTests {
        enableAlsoRunningOnPhysicalDevices = true
    }
    additionalDeviceTestTags.add("graphics_core")
}

