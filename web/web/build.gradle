import androidx.build.SoftwareType
import androidx.build.AndroidXConfig


plugins {
    id("AndroidXPlugin")
    id("com.android.library")
}

dependencies {
    api(libs.jspecify)
    api("androidx.annotation:annotation:1.8.1")
    implementation(libs.kotlinCoroutinesCore)

    testImplementation(libs.junit)
    testImplementation(libs.kotlinTest)
    testImplementation(libs.truth)
    testImplementation(libs.byteBuddy)

    androidTestImplementation(libs.testExtJunit)
    androidTestImplementation(libs.testCore)
    androidTestImplementation(libs.testRunner)
    androidTestImplementation(libs.testRules)
    androidTestImplementation(libs.truth)
}

ext {
    webviewBoundaryInterfacesDir = new File(AndroidXConfig.getExternalProjectPath(project),
            "webview_support_interfaces")
}

android {
    defaultConfig {
        consumerProguardFiles(
                new File(webviewBoundaryInterfacesDir, "proguard.flags")
        )
    }
    namespace = "androidx.web"
    compileSdk { version = release(37) }
}

androidComponents {
    def boundaryInterfacesPath = new File(webviewBoundaryInterfacesDir, "web/src").getCanonicalPath()
    onVariants(selector().all()) { variant ->
        // Allow compiling the WebView support library boundary interfaces from this project.
        variant.sources.java.addStaticSourceDirectory(boundaryInterfacesPath)
    }
}

androidx {
    name = "web:web"
    type = SoftwareType.PUBLISHED_LIBRARY

    inceptionYear = "2026"
    description = "Web is a collection of modern APIs that can be used with android.webkit and androidx.webkit."
    additionalDeviceTestApkKeys.add("chrome")
}